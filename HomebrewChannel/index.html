<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TikTok TV Fixed</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
        }
        #tiktok-container {
            width: 100%; height: 100%; border: none;
        }
    </style>
</head>
<body>

    <!-- Trỏ thẳng vào TikTok di động mượt để bypass lỗi 502 -->
    <iframe id="tiktok-container" src="https://tiktok.com" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>

    <script>
        // Lướt bằng con lăn trên Magic Remote
        window.addEventListener('wheel', function(event) {
            var iframe = document.getElementById('tiktok-container');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.scrollBy(0, event.deltaY);
            }
        });

        // Lướt bằng phím Lên / Xuống trên Remote
        window.addEventListener('keydown', function(e) {
            var iframe = document.getElementById('tiktok-container');
            if (!iframe) return;
            if (e.keyCode === 38) { // Mũi tên Lên
                iframe.contentWindow.scrollBy(0, -600);
            } else if (e.keyCode === 40) { // Mũi tên Xuống
                iframe.contentWindow.scrollBy(0, 600);
            }
        });
    </script>
</body>
</html>
